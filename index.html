<!doctype html>
<html>
	<head>
		<title>Notes</title>
		<link rel="stylesheet" href="styles.css" >
		<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00897b">
	</head>
	<body>
		<p>Write Your Notes</p>
		<div class='noteCount'></div>
		<input placeholder='Type Here...' class='js-notesToBeAdded inputBox'>
		
		<button onclick="addNotes();" class='js-addButton addButton'>Add</button>
		
		<div class='js-listOfNotes'></div>
		
		
		<script src='index.js'></script>
		<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('notes/service-worker.js')
        .then(() => console.log('Service worker registered'))
        .catch(err => console.log('Service worker failed:', err));
    }
  </script>
	</body>
</html>
